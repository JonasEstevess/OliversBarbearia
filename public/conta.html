<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha conta — Oliver's Barbearia</title>
  <meta name="theme-color" content="#0b0a08">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/booking.css">
  <link rel="stylesheet" href="/css/account.css">
</head>
<body>
  <header class="nav is-scrolled">
    <div class="container nav__inner">
      <a class="brand" href="/"><img data-img="logo" alt="" width="44" height="44"><span>Oliver's</span></a>
      <div class="nav__actions">
        <span data-user-slot></span>
        <button class="btn btn--sm" data-book>Agendar</button>
      </div>
    </div>
  </header>

  <main class="page container">
    <div class="page__head">
      <div>
        <p class="eyebrow">Minha conta</p>
        <h1 class="display" data-hello>Olá</h1>
      </div>
      <button class="btn btn--ghost btn--sm" data-logout>Sair</button>
    </div>

    <section data-next class="next-card"></section>

    <h2 class="list-title">Próximos</h2>
    <div class="appt-list" data-upcoming></div>

    <h2 class="list-title">Histórico</h2>
    <div class="appt-list" data-history></div>
  </main>

  <script type="module" src="/js/account.js"></script>
</body>
</html>
